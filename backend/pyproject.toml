[project]
name = "mre-backend"
version = "0.1.0"
description = "Model Reasoning Explorer backend"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MRE Contributors"}]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "numpy>=1.26.0",
  "torch>=2.2.0",
  "transformers>=4.42.0",
  "torchvision>=0.17.0",
  "pillow>=10.3.0",
  "scikit-learn>=1.4.0",
  "captum>=0.7.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "httpx>=0.27.0",
]

[project.scripts]
mre = "mre_backend.cli:app"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
