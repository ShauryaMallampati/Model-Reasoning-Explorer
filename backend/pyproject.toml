[project]
name = "mre-backend"
version = "0.1.0"
description = "Model Reasoning Explorer backend"
readme = {text = "Python backend and CLI for Model Reasoning Explorer. See the repository README for setup, supported models, and limitations.", content-type = "text/markdown"}
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MRE Contributors"}]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "numpy>=1.26.0",
  "torch>=2.6,<3",
  "transformers>=4.42,<5",
  "torchvision>=0.21,<1",
  "pillow>=10.3.0",
  "scikit-learn>=1.4.0",
  "captum>=0.7.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "httpx>=0.27.0",
  "httpx2>=1",
  "build>=1.2,<2",
]

[project.scripts]
mre = "mre_backend.cli:app"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
