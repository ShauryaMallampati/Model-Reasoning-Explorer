name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -e backend[dev]
      - name: Lint backend
        run: |
          cd backend
          python -m ruff check .
          python -m black --check .
      - name: Test backend
        run: |
          cd backend
          python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        run: |
          cd frontend
          npm install
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint
          npm run typecheck
      - name: Test frontend
        run: |
          cd frontend
          npm run test
      - name: Build frontend
        run: |
          cd frontend
          npm run build
