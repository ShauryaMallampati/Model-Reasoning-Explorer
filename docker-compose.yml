version: "3.9"
services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    environment:
      - MRE_ALLOW_GPU=0
      - MRE_CONFIG=/app/backend/mre_config.toml
    ports:
      - "8000:8000"
    command: bash -lc "pip install -U pip && pip install -e /app/backend && uvicorn mre_backend.main:app --host 0.0.0.0 --port 8000"
  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
